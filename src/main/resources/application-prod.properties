# ---------------------------------------------------------------------------
# Production datastore: PostgreSQL. Flyway owns this schema (migrations in
# src/main/resources/db/migration) and Hibernate is restricted to
# `validate` - it checks the entities against the real schema at startup
# and refuses to boot on a mismatch, but never alters a production table
# itself.
#
# No defaults on the values below, on purpose: a prod deploy missing one
# of these env vars fails fast at startup with a clear connection error,
# instead of silently booting against the wrong database or an empty
# password.
# ---------------------------------------------------------------------------
internal-auth.issuer-url=${INTERNAL_AUTH_ISSUER_URL}
internal-auth.base-url=${INTERNAL_AUTH_BASE_URL}

spring.datasource.url=jdbc:postgresql://${POSTGRES_URL}:${DB_PORT:5432}/${POSTGRES_DB}?sslmode=require
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=270000

# Keep idle connections alive and detect dropped ones quickly (Neon closes idle sockets).
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# Two scheduler threads so the keep-alive pings and nightly jobs cannot block each other.
spring.task.scheduling.pool.size=2
