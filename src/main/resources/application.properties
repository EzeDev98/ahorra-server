spring.application.name=ahorra

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.title=${APP_TITLE:/api/v1}
server.port=${PORT:2050}

# Ahorra's own client-application credentials on internal-auth-server.
# Left blank on purpose - Step 1e (registering Ahorra as a client
# application) doesn't exist yet, so there is nothing real to put here.
internal-auth.client-id=${INTERNAL_AUTH_CLIENT_ID:ahorra}
internal-auth.client-secret=${INTERNAL_AUTH_CLIENT_SECRET:}

# Danger-zone endpoint secrets. Blank-disables-the-endpoint by design
# (see ResetAuthorizer / SessionInvalidateAuthorizer) - set real values
# via env var (or application-local.properties, gitignored) per
# environment when you actually want these endpoints reachable.
internal-auth.reset.secret=${INTERNAL_AUTH_RESET_SECRET:}
app.reset.secret=${APP_RESET_SECRET:}
app.session-invalidate.secret=${APP_SESSION_INVALIDATE_SECRET:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# LLM entry parsing (Anthropic). The API key has no default on purpose:
# set ANTHROPIC_API_KEY as an env var, or anthropic.api-key in your
# gitignored application-local.properties. Without it the app still boots,
# and POST /entries/capture returns an error saying parsing isn't configured.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.timeout-seconds=${ANTHROPIC_TIMEOUT_SECONDS:20}

# Timezone used to decide what "today" means when parsing entries.
app.timezone=${APP_TIMEZONE:Africa/Lagos}

# Day-close cutover times. hard-gate-time: from then on, unconfirmed entries
# block further capture. close-cron: when each day is closed or suspended.
# Both are app-wide for now (per-user settings can come later).
app.day.hard-gate-time=${APP_DAY_HARD_GATE_TIME:22:00}
app.day.close-cron=${APP_DAY_CLOSE_CRON:0 59 23 * * *}

# Role name (as issued in the "roles" JWT claim) that counts as an Ahorra admin. Compared in lowercase.
app.security.admin-role=${ADMIN_ROLE_NAME:admin_role}

# Web push for the daily nudge. Leave the keys empty to switch push off. Generate a pair with: npx web-push generate-vapid-keys
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
# A contact address for the push services, written as mailto:name@example.com
app.push.subject=${VAPID_SUBJECT:}
# When the evening nudge goes out (server time zone). Default: 21:00 every day.
app.push.nudge-cron=${APP_PUSH_NUDGE_CRON:0 0 21 * * *}

# Extra browser origins allowed by CORS, comma separated (the client's own domain). Localhost and *.onrender.com are always allowed.
app.cors.extra-origins=${APP_CORS_EXTRA_ORIGINS:}

# Which LLM reads entries: anthropic (default), groq, mistral or gemini. Exactly one is active at a time.
# Switch with APP_PARSER_PROVIDER (or app.parser.provider in application-local.properties). Each provider below
# needs only its own key; the others are ignored. As with Anthropic, a missing key means the app still boots and
# POST /entries/capture returns an error saying parsing isn't configured.
app.parser.provider=${APP_PARSER_PROVIDER:groq}

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:20}
# Voice entries: Whisper on Groq turns a short recording into text (uses the same key as above).
groq.transcription-model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
groq.transcription-timeout-seconds=${GROQ_TRANSCRIPTION_TIMEOUT_SECONDS:30}
# Room for a one-minute recording; the server itself rejects anything over 2 MB with a clear message.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

mistral.api-key=${MISTRAL_API_KEY:}
mistral.model=${MISTRAL_MODEL:mistral-small-latest}
mistral.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
mistral.timeout-seconds=${MISTRAL_TIMEOUT_SECONDS:20}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}
