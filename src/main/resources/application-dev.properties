# ---------------------------------------------------------------------------
# Local development datastore: MySQL. Hibernate manages the schema
# directly here (ddl-auto=update) - Flyway does NOT run against dev,
# same "flyway only for prod" split internal-auth-server uses. `update`
# is fine for a disposable local database; never point this profile at
# a database anyone actually depends on.
# ---------------------------------------------------------------------------
internal-auth.issuer-url=${INTERNAL_AUTH_ISSUER_URL:http://localhost:5151}
internal-auth.base-url=${INTERNAL_AUTH_BASE_URL:http://localhost:5151/api/v1}

spring.datasource.url=jdbc:mysql://localhost:3306/ahorra_db?serverTimezone=Africa/Lagos
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false
